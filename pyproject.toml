[project]
name = "teto"
version = "0.3.0"
description = "An offline evaluation pipeline for agents and generated responses."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
teto = "evaluator.cli:teto_main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evaluator"
module-root = ""
