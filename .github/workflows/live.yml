name: Teto live evaluation

on:
  schedule:
    - cron: '23 18 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teto-live
  cancel-in-progress: false

jobs:
  evaluate:
    if: vars.TETO_LIVE_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.10"
      - run: uv sync --locked --python 3.13.12
      - name: Collect live trial evidence
        env:
          SUITE: ${{ vars.TETO_LIVE_SUITE }}
          HARNESS: ${{ vars.TETO_LIVE_HARNESS }}
          TETO_LIVE_API_KEY: ${{ secrets.TETO_LIVE_API_KEY }}
          EVIDENCE_DIR: ${{ runner.temp }}/teto-live
        run: |
          mkdir "$EVIDENCE_DIR"
          uv run --locked teto run --require-mode live --input "$SUITE" --harness "$HARNESS" \
            --artifact-id "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$EVIDENCE_DIR/run.json"
      - name: Score live evidence
        env:
          SUITE: ${{ vars.TETO_LIVE_SUITE }}
          EVIDENCE_DIR: ${{ runner.temp }}/teto-live
        run: |
          uv run --locked teto score suite-run --input "$EVIDENCE_DIR/run.json" \
            --suite "$SUITE" --output "$EVIDENCE_DIR/score.json"
      - name: Archive live evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: teto-live-evidence
          path: ${{ runner.temp }}/teto-live/
