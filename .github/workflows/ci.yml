name: Teto checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.10"
      - run: uv sync --locked --python 3.13.12
      - run: uv run --locked teto --help
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Verify suite execution and offline rescoring
        env:
          SUITE_DIR: ${{ runner.temp }}/teto-suite
        run: |
          mkdir "$SUITE_DIR"
          uv run --locked teto run --require-mode offline --input examples/scripted-suite.json \
            --harness examples/scripted-harness.py --artifact-id "${GITHUB_SHA}" \
            --output "$SUITE_DIR/run.json"
          for output in score rescore; do
            uv run --locked teto score suite-run --input "$SUITE_DIR/run.json" \
              --suite examples/scripted-suite.json --output "$SUITE_DIR/$output.json"
          done
          cmp "$SUITE_DIR/score.json" "$SUITE_DIR/rescore.json"
          uv run --locked teto gate --input "$SUITE_DIR/run.json" \
            --suite examples/scripted-suite.json --policy examples/scripted-policy.json \
            --output "$SUITE_DIR/gate.json"
          uv run --locked python - "$SUITE_DIR/score.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["summary"]["verified_success"]["counts"]["pass"] == 4
          assert report["slices"]["unicode"]["summary"]["tool_expectations"]["counts"]["pass"] == 2
          PY
      - name: Archive suite evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: teto-suite
          path: ${{ runner.temp }}/teto-suite/
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Ceskoslov/Nausicaa
          ref: b23edbb908ffb3d51cd67b034519aaa68133a9e9
          path: nausicaa
          persist-credentials: false
      - name: Prepare Nausicaa dependencies
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable fetch --manifest-path nausicaa/Cargo.toml --locked
      - name: Verify offline comparison and scoring
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/teto-evidence
        run: |
          mkdir "$EVIDENCE_DIR"
          cargo +stable run --manifest-path nausicaa/Cargo.toml -p agent-harness-eval \
            --locked --offline -- --output "$EVIDENCE_DIR/nausicaa"
          uv run --locked teto import-nausicaa --input "$EVIDENCE_DIR/nausicaa/summary.json" \
            --mode core_only --artifact-id nausicaa-core --output "$EVIDENCE_DIR/core.json"
          uv run --locked teto import-nausicaa --input "$EVIDENCE_DIR/nausicaa/summary.json" \
            --mode task --artifact-id nausicaa-task --output "$EVIDENCE_DIR/task.json"

          uv run --locked teto compare --baseline "$EVIDENCE_DIR/core.json" \
            --candidate "$EVIDENCE_DIR/task.json" --output "$EVIDENCE_DIR/release.json"
          hold_code=0
          uv run --locked teto compare --baseline "$EVIDENCE_DIR/task.json" \
            --candidate "$EVIDENCE_DIR/core.json" --output "$EVIDENCE_DIR/hold.json" || hold_code=$?
          test "$hold_code" -eq 1

          uv run --locked teto score nausicaa --input "$EVIDENCE_DIR/nausicaa/summary.json" \
            --mode task --artifact-id nausicaa-task --output "$EVIDENCE_DIR/nausicaa-scores.json"
          uv run --locked teto score ohmu --input examples/ohmu-evaluation.json \
            --cases examples/ohmu-cases.json --artifact-id ohmu-example --output "$EVIDENCE_DIR/ohmu-scores.json"

          uv run --locked python - "$EVIDENCE_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence = Path(sys.argv[1])
          nausicaa = json.loads((evidence / "nausicaa-scores.json").read_text())
          assert nausicaa["summary"]["verified_success"]["counts"]["pass"] == 2
          assert nausicaa["summary"]["receipt_expectations"]["counts"]["pass"] == 5
          ohmu = json.loads((evidence / "ohmu-scores.json").read_text())
          assert ohmu["summary"]["expected_source_recall"]["mean"] == 0.5
          assert ohmu["summary"]["abstention"]["counts"]["unscored"] == 1
          PY
      - name: Verify asynchronous jobs and CLI report parity
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/teto-evidence
        run: |
          uv run --locked python scripts/verify_jobs.py \
            --nausicaa "$EVIDENCE_DIR/nausicaa/summary.json"
      - name: Archive evaluation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: teto-evidence
          path: ${{ runner.temp }}/teto-evidence/
